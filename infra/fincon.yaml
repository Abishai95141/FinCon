AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  FinCon on Fargate: one service behind an ALB serving the screens, the JSON API
  and the MCP endpoint from one container, with EFS holding the decision log.

# WHY EFS AND NOT S3. The decision log and the review log are append-only JSONL
# under an flock on a sidecar file. NFSv4 supports that lock and object storage
# does not, so the hash chain an auditor replays needs a filesystem. Moving it to
# S3 is real work on the one artifact this product asks people to trust, and it
# is not on the path to a running deployment.
#
# WHY THE TASKS SIT IN PUBLIC SUBNETS. A NAT gateway is about USD 32/month, more
# than everything else here combined. The tasks need egress (the model edge,
# Cognito's JWKS, ECR) and nothing needs to reach them except the load balancer,
# which the security group enforces by source rather than by subnet. Public
# subnet plus a closed inbound rule is the same exposure for a third of the bill.
#
# WHY CLOUDFORMATION. The AWS CLI is already here and rollback is built in. A
# second tool to install is a second thing that can be the wrong version on
# somebody else's machine.

Parameters:
  Image:
    Type: String
    Description: ECR image URI including tag. Never ":latest" — a service that
      redeploys to a moving tag cannot be rolled back to what was running.
  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Leave empty and the container serves the screens with no MCP
      endpoint, which it announces. Set it and MCP requires OAuth.
  CognitoClientId:
    Type: String
    Default: ""
  CognitoClientSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN. The value never appears in this template,
      in a task definition, or in a console page somebody screenshots.
  SessionSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for the cookie signing key.
  DeepSeekApiKeyArn:
    Type: String
    Default: ""
  PublicUrl:
    Type: String
    Default: ""
    Description: The https:// name this is reachable at. OAuth redirect URLs and
      the token audience are absolute, so this cannot be derived from a request
      header — that is how an attacker picks your issuer.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate. Empty serves plain HTTP, which is fine for a
      first deploy and must not carry a session cookie in anger.
  DesiredCount:
    Type: Number
    Default: 1
    Description: One task. The log is flock-serialised on a shared filesystem so
      more than one is safe, but two tasks on one EFS is a claim worth testing
      before it is a claim worth making.
  TaskCpu:
    Type: String
    Default: "256"
  TaskMemory:
    Type: String
    Default: "512"

Conditions:
  HasTls: !Not [!Equals [!Ref CertificateArn, ""]]
  HasCognitoSecret: !Not [!Equals [!Ref CognitoClientSecretArn, ""]]
  HasSessionSecret: !Not [!Equals [!Ref SessionSecretArn, ""]]
  HasModelKey: !Not [!Equals [!Ref DeepSeekApiKeyArn, ""]]

Resources:
  # ---- network ------------------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  AssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable}
  AssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable}

  # ---- who may talk to whom ----------------------------------------------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - !If
          - HasTls
          - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
          - !Ref AWS::NoValue

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # The tasks have public IPs and no inbound rule reaches them from the
      # internet. This is the whole reason skipping the NAT gateway is safe, and
      # it is enforced by source security group rather than by subnet.
      GroupDescription: Only the load balancer reaches the container
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from the tasks only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  # ---- the records --------------------------------------------------------

  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Retain, loudly. This holds every decision log. A stack delete that took
      # the audit trail with it would destroy the one artifact this product asks
      # a regulator to trust.
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags: [{Key: Name, Value: !Sub "${AWS::StackName}-records"}]

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref SubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref SubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]

  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: {Uid: "10001", Gid: "10001"}
      RootDirectory:
        Path: /fincon
        CreationInfo: {OwnerUid: "10001", OwnerGid: "10001", Permissions: "0755"}

  # ---- the service --------------------------------------------------------

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}"
      ClusterSettings: [{Name: containerInsights, Value: enabled}]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-the-named-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Only the secrets this stack was given. `secretsmanager:*` on `*`
              # would let a compromised task read every secret in the account,
              # and the blast radius of a container is not a detail.
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Split
                  - ","
                  - !Sub "${CognitoClientSecretArn},${SessionSecretArn},${DeepSeekApiKeyArn}"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cognito-and-records
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:SignUp
                  - cognito-idp:InitiateAuth
                  - cognito-idp:ConfirmSignUp
                  - cognito-idp:ResendConfirmationCode
                  - cognito-idp:GetUser
                Resource: !Sub
                  - "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${Pool}"
                  - Pool: !Ref CognitoUserPoolId
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt FileSystem.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: records
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: fincon
          Image: !Ref Image
          Essential: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          MountPoints:
            - {SourceVolume: records, ContainerPath: /app/data/runs, ReadOnly: false}
          Environment:
            - {Name: RECON_ENV, Value: prod}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId}
            - {Name: COGNITO_CLIENT_ID, Value: !Ref CognitoClientId}
            - {Name: FINCON_PUBLIC_URL, Value: !Ref PublicUrl}
            - {Name: FINCON_MCP_HOST, Value: 0.0.0.0}
          Secrets:
            - !If
              - HasCognitoSecret
              - {Name: COGNITO_CLIENT_SECRET, ValueFrom: !Ref CognitoClientSecretArn}
              - !Ref AWS::NoValue
            - !If
              - HasSessionSecret
              - {Name: FINCON_SESSION_SECRET, ValueFrom: !Ref SessionSecretArn}
              - !Ref AWS::NoValue
            - !If
              - HasModelKey
              - {Name: DEEPSEEK_API_KEY, ValueFrom: !Ref DeepSeekApiKeyArn}
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fincon

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes:
        # MCP over Streamable HTTP holds a connection open. The default 300s
        # would cut a long tool call and the client would see a transport error
        # rather than a slow answer.
        - {Key: deregistration_delay.timeout_seconds, Value: "20"}
        - {Key: stickiness.enabled, Value: "true"}
        - {Key: stickiness.type, Value: lb_cookie}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasTls
          # With a certificate, port 80 exists only to send people to 443. A
          # session cookie on plain HTTP is a session cookie on the wire.
          - Type: redirect
            RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasTls
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, MountTargetA, MountTargetB]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: fincon, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup}

Outputs:
  Url:
    Description: Where this is reachable. Put it in FINCON_PUBLIC_URL and
      redeploy — OAuth needs the address to be known, not discovered.
    Value: !Sub
      - "${Scheme}://${Dns}"
      - Scheme: !If [HasTls, https, http]
        Dns: !GetAtt LoadBalancer.DNSName
  McpEndpoint:
    Value: !Sub
      - "${Scheme}://${Dns}/mcp"
      - Scheme: !If [HasTls, https, http]
        Dns: !GetAtt LoadBalancer.DNSName
  FileSystemId:
    Description: Retained on stack delete. It holds every decision log.
    Value: !Ref FileSystem
  ClusterName:
    Value: !Ref Cluster
