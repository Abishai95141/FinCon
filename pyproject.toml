[project]
name = "recon"
version = "0.0.0"
description = "Reconciliation controller — open intake, verified commit"
requires-python = ">=3.12"

# Pinned deliberately. Beancount v3 split out beangulp/beanquery and removed
# bean-extract/bean-identify from core — v2 tutorials do not apply.
# See docs/03-BUILD-PLAN.md problem P15.
# Every one of these is imported somewhere under src/. Ten more were declared
# here until 2026-08-26 and imported nowhere — splink, duckdb, polars, lxml,
# ofxparse, python-calamine, sqlalchemy, psycopg, anthropic and beanquery — which
# read as capability this project does not have. A dependency list is a claim
# about what a thing is built on, and `tests/property/test_dependencies.py` now
# fails if one of these stops being used or a new unused one appears.
dependencies = [
  "beancount>=3.0",   # the double-entry engine. post_and_assert round-trips
                      # through the real loader and its errors are the verdict
  "pydantic>=2.7",    # the semver'd contract surface — ADR-002
  "fastapi>=0.115",   # HTTP surface, and the generated OpenAPI schemas
  "uvicorn>=0.30",    # serves it
  "ortools>=9.10",    # CP-SAT, behind the T2 subset-sum enumerator
  "fastmcp>=2.0",     # MCP server, and the Cognito OAuth provider
  "boto3>=1.43.79",   # Cognito, S3, Secrets Manager
  "botocore>=1.35",   # ClientError, caught by name in api/auth.py. Declared
                      # rather than inherited from boto3: we import it directly,
                      # and a transitive dependency is not a promise
  "cryptography>=43", # Ed25519 — the authority bundles' signatures. This one is
                      # load-bearing for the trust argument, so it is not going
                      # to arrive by accident through somebody else's tree
]

# The product's two surfaces, as commands. `src/recon/api/` and
# `src/recon/mcp/` were empty files until P13; a substrate nobody can start is
# not a substrate.
[project.scripts]
recon-api = "recon.api.serve:main"
recon-mcp = "recon.mcp.server:main"
recon-mcp-http = "recon.mcp.http:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  # The infrastructure tests parse infra/fincon.yaml. Declared rather than
  # reached for with `importorskip`, because a skip on a missing parser is a
  # green tick over every deployment invariant at once.
  "pyyaml>=6.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.ruff]
line-length = 100
src = ["src", "bench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Gate files are named gate_p*.py, not test_*.py. Without this they are
# silently skipped on directory collection and a "green" gate rots unnoticed.
python_files = ["test_*.py", "gate_p*.py"]
addopts = "--strict-markers"
# A known-broken row is an xfail reproducer, not a line in a table someone
# remembers to edit. `strict` makes XPASS fail the suite, so the day a problem
# closes CI breaks and forces the row to be removed. Without it the fix lands,
# nobody notices, and the table rots — which is exactly what happened to F1-F4.
xfail_strict = true
markers = [
  "gate: a phase gate — green only when its output is pasted into STATUS.md",
  "known_broken: an xfail reproducer for an open problem. XPASS means it is fixed and the row must go.",
]
