[project]
name = "recon"
version = "0.0.0"
description = "Reconciliation controller — open intake, verified commit"
requires-python = ">=3.12"

# Pinned deliberately. Beancount v3 split out beangulp/beanquery and removed
# bean-extract/bean-identify from core — v2 tutorials do not apply.
# See docs/03-BUILD-PLAN.md problem P15.
dependencies = [
  "beancount>=3.0",
  "beanquery>=0.1",
  "polars>=1.0",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "ortools>=9.10",
  "splink>=4.0",
  "duckdb>=1.0",
  "lxml>=5.2",
  "ofxparse>=0.21",
  "python-calamine>=0.2",
  "anthropic>=0.40",
  "fastmcp>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.ruff]
line-length = 100
src = ["src", "bench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Gate files are named gate_p*.py, not test_*.py. Without this they are
# silently skipped on directory collection and a "green" gate rots unnoticed.
python_files = ["test_*.py", "gate_p*.py"]
addopts = "--strict-markers"
markers = [
  "gate: a phase gate — green only when its output is pasted into STATUS.md",
]
